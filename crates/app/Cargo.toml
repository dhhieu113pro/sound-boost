[package]
name = "sb-app"
description = "Sound Booster user interface: the tray app and the command-line control tool."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "sb-tray"
path = "src/bin/sb-tray.rs"

[[bin]]
name = "sb-gain"
path = "src/bin/sb-gain.rs"

[dependencies]
sb-core.workspace = true
sb-ipc.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
